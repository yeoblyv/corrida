# slam_toolbox settings for online async mapping, based on
# config/mapper_params_online_async.yaml from slam_toolbox 2.8.4:
# https://github.com/SteveMacenski/slam_toolbox/blob/2.8.4/config/mapper_params_online_async.yaml
# (full citation: docs/REFERENCES.md)
# What each parameter does is in the slam_toolbox README. Values that differ from
# upstream have a comment next to them.

# A wildcard instead of "slam_toolbox": a key with only the node name matches a
# node in the root namespace, and ours runs under the robot namespace.
/**:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    # upstream base_footprint. The Create 3 publishes odom -> base_link and the lidar
    # transform hangs off base_link:
    # https://iroboteducation.github.io/create3_docs/api/ros2/
    base_frame: base_link
    # The README asks for an absolute topic, but /scan would skip the robot namespace,
    # so this one is relative on purpose.
    scan_topic: scan
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02  # if 0 never publishes odometry
    map_update_interval: 2.0  # upstream 5.0, the map refreshes faster
    resolution: 0.05
    restamp_tf: false
    # A1M8 range is 0.15 - 12 m (6 m on A1M8-R4 and older), from the
    # "Measurement Performance" table of the datasheet: https://www.slamtec.com/en/support
    min_laser_range: 0.15
    max_laser_range: 12.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000  # needs a bigger stack to serialize large maps
    # upstream true. It keeps a cache of scans for the interactive mode of the rviz
    # plugin, we look at the map in Foxglove.
    enable_interactive_mode: false

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    # upstream 0.5 m / 0.5 rad, smaller steps for a small indoor maze
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
