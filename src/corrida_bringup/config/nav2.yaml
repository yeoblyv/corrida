# Nav2 config for the Create 3 with the lidar, started by launch/nav2.launch.py.
# Based on the nav2.yaml of the TurtleBot 4 (same robot base and lidar) and on the
# defaults of nav2_bringup 1.3.13:
# https://github.com/turtlebot/turtlebot4/blob/jazzy/turtlebot4_navigation/config/nav2.yaml
# https://github.com/ros-navigation/navigation2/blob/1.3.13/nav2_bringup/params/nav2_params.yaml
# and on the Nav2 tuning guide:
# https://github.com/ros-navigation/docs.nav2.org/blob/rolling/docs/configuration_and_development/tuning_guide.md
# (full citations: docs/REFERENCES.md). Values we changed have a comment.
# The keys start with /** so they also match the nodes inside the robot namespace.

/**/bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom_reliable  # from our odom_relay, Nav2 can't read the robot's odom directly
    bt_loop_duration: 50  # ms, upstream 10, lighter on the Pi
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose"]  # upstream also has navigate_through_poses
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

/**/controller_server:
  ros__parameters:
    # upstream 20 Hz, 10 Hz is enough at 0.15 m/s and less work on the Pi
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0  # s, upstream 0.3, a short failure doesn't start a recovery yet
    odom_topic: odom_reliable  # see bt_navigator
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.15  # upstream 0.25, the heading at a frontier doesn't matter
    FollowPath:
      # MPPI, like the TurtleBot 4. Pure pursuit got stuck at walls and in doorways (its
      # check counts the robot as touching a wall with 3-7 cm still left), MPPI prefers
      # ways away from walls and explored the whole simulated maze in 3 minutes
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 30  # upstream 56, with model_dt 0.1 that is 3 s ahead
      model_dt: 0.1  # upstream 0.05, = 1 / controller_frequency
      batch_size: 1000  # upstream 2000, less CPU
      ax_max: 2.0  # upstream 3.0
      ax_min: -2.0
      ay_max: 3.0
      ay_min: -3.0
      az_max: 3.0  # upstream 3.5
      vx_std: 0.2
      vy_std: 0.2
      # upstream 0.4, with less spread the robot crept between a wall and a pole in the simulation
      wz_std: 0.6
      vx_max: 0.15  # m/s, upstream 0.5, slow on purpose, the robot can do 0.306
      vx_min: 0.0  # upstream -0.35, the Create 3 only drives backwards a few centimetres
      vy_max: 0.5
      wz_max: 0.8  # rad/s, upstream 1.9, slam_toolbox likes slow turns
      iteration_count: 1
      prune_distance: 1.0  # m, upstream 1.7, at 0.15 m/s 1 m of the path is plenty
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false  # upstream true, lighter on the Pi
      regenerate_noises: true
      # upstream also has GoalAngleCritic, the heading at a frontier doesn't matter
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic", "PathAlignCritic",
        "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        # upstream 253 and 300, a much bigger penalty near walls so the robot keeps off them
        near_collision_cost: 230
        critical_cost: 1000.0
        consider_footprint: false  # our robot is round, see robot_radius
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

/**/local_costmap/local_costmap:
  ros__parameters:
    update_frequency: 5.0
    publish_frequency: 2.0
    global_frame: odom
    robot_base_frame: base_link
    rolling_window: true
    width: 3
    height: 3
    # m, upstream 0.05, smaller cells put the walls closer to where the lidar sees them
    resolution: 0.025
    robot_radius: 0.175  # m, the robot's own tf puts the bumper 0.175 m from its centre
    footprint_padding: 0.0  # upstream 0.01, the radius is the bumper already
    plugins: ["obstacle_layer", "inflation_layer"]
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      # upstream 0.0, our lidar tf sits at floor height so the scan points come out around z = 0
      # and a bit below it when the robot tilts
      min_obstacle_height: -0.5
      observation_sources: scan
      scan:
        topic: scan
        data_type: "LaserScan"
        marking: true
        clearing: true
        min_obstacle_height: -0.5
        max_obstacle_height: 2.0
        raytrace_max_range: 3.0
        obstacle_max_range: 2.5
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 3.0
      # m, upstream 0.7, as wide as our corridors so the paths stay in the middle, see
      # "Inflation Potential Fields" in the Nav2 tuning guide
      inflation_radius: 0.6
    always_send_full_costmap: true

/**/global_costmap/global_costmap:
  ros__parameters:
    update_frequency: 1.0
    publish_frequency: 1.0
    global_frame: map
    robot_base_frame: base_link
    resolution: 0.05  # the same as the slam_toolbox map
    robot_radius: 0.175
    footprint_padding: 0.0
    track_unknown_space: true
    map_topic: /map  # with the slash, slam_toolbox publishes the map outside the robot namespace
    plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_subscribe_transient_local: true
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      min_obstacle_height: -0.5  # same as the local costmap
      observation_sources: scan
      scan:
        topic: scan
        data_type: "LaserScan"
        marking: true
        clearing: true
        min_obstacle_height: -0.5
        max_obstacle_height: 2.0
        raytrace_max_range: 3.0
        obstacle_max_range: 2.5
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 3.0
      inflation_radius: 0.6  # see the local costmap
    always_send_full_costmap: true

/**/planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0  # upstream 20, the behavior tree replans once a second
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

/**/behavior_server:
  ros__parameters:
    cycle_frequency: 10.0
    # upstream also has backup, drive_on_heading and assisted_teleop,
    # our behavior tree (config/navigate_to_pose.xml) only uses these two
    behavior_plugins: ["spin", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: map
    local_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6  # rad/s, upstream 1.0, slow turns for slam_toolbox
    min_rotational_vel: 0.3
    rotational_acc_lim: 3.2

/**/collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"  # upstream base_footprint, our robot's tf is on base_link
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_nav"  # upstream cmd_vel_smoothed, we have no velocity smoother
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # the robot's footprint is moved ahead along the commanded speed, and the robot
    # slows down or stops before the footprint would reach a scan point
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"  # upstream /local_costmap/..., no slash
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      enabled: True
